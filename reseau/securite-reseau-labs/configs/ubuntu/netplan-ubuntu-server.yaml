# /etc/netplan/50-cloud-init.yaml : IP fixe d'Ubuntu Server (192.168.10.20)
# Pour ubuntu-server-2, remplacer l'adresse par 192.168.10.30/24.
# Application : sudo netplan apply
network:
  version: 2
  ethernets:
    ens33:
      dhcp4: false
      addresses:
        - 192.168.10.20/24
      routes:
        - to: default
          via: 192.168.10.1
      nameservers:
        addresses:
          - 192.168.10.1
